<nav class="left">
  <div class="sticky">
    <div>
      @if (profile(); as myProfile) {
        <app-profile-badge
          [username]="myProfile.username"
          [name]="myProfile.name"
          [photoUrl]="myProfile.photoUrl"
          [routerLink]="['/users', myProfile.username, 'profile']"></app-profile-badge>
      }
    </div>
    <div class="links">
      <a class="link" routerLink="/posts" routerLinkActive="active">
        <mat-icon fontIcon="home"></mat-icon>
        <div>Home</div>
      </a>
      @if (username(); as myUsername) {
        <a class="link" [routerLink]="['/users', myUsername, 'profile']" routerLinkActive="active">
          <mat-icon fontIcon="person"></mat-icon>
          <div>Profile</div>
        </a>
      }
      <a class="link" routerLink="/settings" routerLinkActive="active">
        <mat-icon fontIcon="settings"></mat-icon>
        <div>Settings</div>
      </a>
      <a class="link" (click)="signOut()">
        <mat-icon fontIcon="logout"></mat-icon>
        <div>Sign out</div>
      </a>
    </div>
  </div>
</nav>

<main class="middle">
  <router-outlet />
</main>

<div class="right">
</div>
